# Include inside the HTTPS server block. Use the same PHP-FPM socket as RBT.
location ~ "^/v/[a-zA-Z0-9_-]{12}$" {
    root /opt/rbt/static;
    try_files /virtual-intercom/index.html =404;
    add_header Cache-Control "no-cache";
    add_header Referrer-Policy "no-referrer";
    add_header Permissions-Policy "camera=(self), microphone=(self)";
}
location ^~ /virtual-intercom/assets/ {
    alias /opt/rbt/static/virtual-intercom/;
    add_header X-Content-Type-Options nosniff;
}
location = /virtual-intercom/jssip.min.js {
    alias /opt/rbt/client/js/jssip.min.js;
    add_header X-Content-Type-Options nosniff;
}
location ^~ /virtual-intercom/api/ {
    client_max_body_size 180k;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/rbt/server/virtual-intercom/http.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/var/run/php/php-fpm.sock;
}
